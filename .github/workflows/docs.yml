# Build the Doxygen API documentation and publish it to GitHub Pages.
#
# Docs are generated by the CMake `docs` target (see docs/CMakeLists.txt). The
# target only parses sources, so the project is configured with the heavy deps
# (spdlog, GTest) off and docs on — no Conan step is required here.
name: Docs

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save free-tier minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen + Graphviz + PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz plantuml
          doxygen --version

      - name: Configure (docs only)
        run: |
          cmake -S . -B build \
            -DPCP_BUILD_DOCS=ON \
            -DPCP_ENABLE_SPDLOG=OFF \
            -DPCP_BUILD_TESTS=OFF

      - name: Build docs
        run: cmake --build build --target docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/doxygen/html

  # Deploy only from the default branch; PRs just build to validate.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
